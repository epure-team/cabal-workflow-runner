name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - name: Pin the public cabal library and install deps
        run: |
          opam pin add -n cabal https://github.com/epure-team/cabal.git
          opam install . --deps-only --with-test

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      - name: Pinned Run integration self-test
        run: scripts/pinned-run-selftest.sh

  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Pin the public cabal library and install deps
        run: |
          opam pin add -n cabal https://github.com/epure-team/cabal.git
          opam install . --deps-only --with-test

      - name: Install jsonschema
        run: pip install jsonschema

      - name: Build (produce _build/default/bin/main.exe)
        run: opam exec -- dune build

      - name: Schema <-> parser parity check
        run: python3 scripts/parity_check.py

  # test/test_pcc_integration.ml (Jalon 3, Workstream B) runs the REAL proof-carrying-change
  # workflow — real pcc-index/pcc-dossier/pcc-preflight/arch-impact/arch-rules subprocesses —
  # against a fixture repo, which needs a whole SEPARATE public repo (epure-team/arch-index)
  # built alongside this one. Mirrors arch-index's own mcp/mcp-credentials pattern: decide up
  # front whether the dependency is reachable and say so LOUDLY when it is not, rather than let
  # a network hiccup either fail the whole CI run or (worse) silently skip with a green check.
  arch-index-availability:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      # Checks BOTH that the repo is reachable AND that its main branch actually has scripts/pcc/
      # on it — not just `git ls-remote` reachability. The two repos are developed in lockstep
      # (this integration test needs arch-index's pcc-* binaries, which land in a companion PR);
      # without this, the window between "cwr's PR is open" and "arch-index's pcc-* PR has
      # merged" reads as a hard pcc-integration job failure, indistinguishable from an actual
      # wiring regression. Treating "reachable but doesn't have this yet" as the same loud,
      # honest skip as "unreachable" keeps that ordinary merge-order window from looking red.
      - id: check
        run: |
          if curl -sf -o /dev/null "https://raw.githubusercontent.com/epure-team/arch-index/main/scripts/pcc/pcc-index"; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=pcc-integration NOT run::epure-team/arch-index's main branch is either unreachable or does not (yet) have scripts/pcc/pcc-index on it, so the proof-carrying-change real-subprocess integration test (test/test_pcc_integration.ml) was skipped entirely. A green CI run here is NOT evidence that the real integration still works — and if arch-index's pcc-* PR simply hasn't merged to main yet, this is expected, not a regression."
          fi

  pcc-integration:
    needs: arch-index-availability
    if: needs.arch-index-availability.outputs.available == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout cabal-workflow-runner
        uses: actions/checkout@v4
        with:
          path: cwr

      - name: Checkout arch-index
        uses: actions/checkout@v4
        with:
          repository: epure-team/arch-index
          path: arch-index

      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.3"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Pin the public cabal library and install deps for BOTH repos (one shared switch)
        run: |
          opam pin add -n cabal https://github.com/epure-team/cabal.git
          # --with-test is REQUIRED, not optional hygiene: arch-index declares tezt as a
          # with-test dependency, its tezt/ dirs are part of @default, and scripts/pcc/pcc-index
          # runs a full `dune build` in the arch-index root at RUNTIME. Without tezt installed
          # that internal build fails, pcc-index emits nothing, and the integration test reports
          # `stdout is not JSON: Blank input data` — a failure three steps away from its cause.
          opam install ./arch-index --deps-only --with-test --yes
          opam install ./cwr --deps-only --with-test --yes

      - name: Build arch-index (pcc-*, arch-impact/arch-rules, decision-lint, producers)
        working-directory: arch-index
        run: opam exec -- dune build

      # A false enabled_if or a build that quietly produced nothing would let the availability
      # gate above read as "everything's fine" while pcc-integration silently tests nothing —
      # exactly the "green without data" shape this whole milestone exists to rule out. Assert
      # every binary the fixture run actually needs, before spending any time on it.
      # arch-index/arch-impact and arch-index/arch-rules are TRACKED wrapper scripts (mode
      # 100755 in git) — they exist and pass `test -x` right after checkout regardless of
      # whether `dune build` produced anything, so testing them alone would not catch a build
      # that silently failed or produced nothing. Assert the underlying `_build/` binaries they
      # wrap, not just the wrappers; pcc-index/pcc-dossier/pcc-preflight ARE the tracked
      # artifact (plain shell, nothing to build), so testing them directly is the real check.
      - name: Assert arch-index's pcc-* tools were actually built
        run: |
          for f in arch-index/_build/default/bin/arch_impact/arch_impact.exe \
                   arch-index/_build/default/bin/arch_rules/arch_rules.exe \
                   arch-index/_build/default/poc/decision-lint/bin/decision_lint.exe \
                   arch-index/scripts/pcc/pcc-index arch-index/scripts/pcc/pcc-dossier \
                   arch-index/scripts/pcc/pcc-preflight; do
            test -x "$f" || { echo "::error::$f is missing or not executable"; exit 1; }
          done

      - name: Build cabal-workflow-runner
        working-directory: cwr
        run: opam exec -- dune build

      - name: Put arch-index's tools on PATH
        run: |
          echo "${{ github.workspace }}/arch-index" >> "$GITHUB_PATH"
          echo "${{ github.workspace }}/arch-index/scripts/pcc" >> "$GITHUB_PATH"

      # test_pcc_integration.ml self-checks the same tools on PATH and exits nonzero with a loud
      # "PCC-INTEGRATION-SKIP" message if any are missing (see the test file's own header) — so a
      # wiring bug in the steps above surfaces as a hard, visible failure HERE, not as a silent
      # 0-tests-run pass.
      - name: Run the real-subprocess proof-carrying-change integration test
        working-directory: cwr
        run: opam exec -- dune build @pcc-integration
